      - name: Corregir incompatibilidad de NotificationHelper
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          file = Path(os.environ["PROJECT_DIR"]) / \
              "app/src/main/java/com/example/NotificationHelper.java"

          text = file.read_text(encoding="utf-8")

          old = """if (timestampMillis <= now || expiresAtMillis <= now || expiresAtMillis < timestampMillis) {
                      return false;
                  }"""

          new = """if (timestampMillis <= now || expiresAtMillis <= now || expiresAtMillis < timestampMillis) {
                      return;
                  }"""

          if old in text:
              file.write_text(text.replace(old, new), encoding="utf-8")
              print("Incompatibilidad corregida.")
          else:
              print("No es necesario aplicar el parche.")
          PY
